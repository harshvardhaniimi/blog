baseURL: "/"
languageCode: en-us
title: Harsh's Corner
theme: archie
copyright: © Harshvardhan
pygmentsstyle: monokai
pygmentscodefences: yes
pygmentscodefencesguesssyntax: yes
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
ignoreErrors: ["error-missing-instagram-accesstoken"]
permalinks: 
  posts: "/:slug/"
params:
  mode: "toggle"
  # Giscus (GitHub Discussions) — fill in after running the wizard at https://giscus.app
  # Leave any field blank to disable comments site-wide.
  giscus:
    repo: ""            # e.g. "harshvardhaniimi/blog-comments"
    repoId: ""          # from giscus wizard
    category: "General"
    categoryId: ""      # from giscus wizard
    mapping: "pathname"
    theme: "preferred_color_scheme"
  # MailerLite embedded form — paste the <div data-form> id from your MailerLite embed snippet.
  # Leave blank to hide the signup block.
  mailerlite:
    accountId: ""       # e.g. "1234567"
    formId: ""          # e.g. "abcdef"
  social:
    - icon: linkedin
      name: LinkedIn
      url: https://www.linkedin.com/in/harshvardhaniimi/
    - icon: github
      name: GitHub
      url: https://github.com/harshvardhaniimi
    - icon: twitter
      name: Twitter
      url: https://twitter.com/harshbutjust
    - icon: threads
      name: Threads
      url: https://www.threads.net/@harsh17.in
    - icon: instagram
      name: Instagram
      url: https://www.instagram.com/harsh17/
    - icon: rss
      name: RSS
      url: /index.xml
  useCDN: no
menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: All posts
      url: /posts
      weight: 2
    # - name: About
    #   url: /about
    #   weight: 3
    - name: Tags
      url: /tags
      weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      math: true

enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - Sitemap
