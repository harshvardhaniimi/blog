{{- with .Site.Params.mailerlite -}}
{{- if and .accountId .formId -}}
<section class="subscribe" style="margin-top:3rem;padding:1.25rem;border:1px solid var(--border,#ddd);border-radius:6px;">
  <h3 style="margin-top:0;">Subscribe to the newsletter</h3>
  <p style="margin:.5rem 0 1rem;">New posts land in your inbox roughly six hours after I publish them. No spam, unsubscribe any time.</p>
  <div class="ml-embedded" data-form="{{ .formId }}"></div>
  <script>
  (function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[])
  .push(arguments);},l=d.createElement(e),l.async=1,l.src=u,
  n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})
  (window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
  ml('account', '{{ .accountId }}');
  </script>
</section>
{{- end -}}
{{- end -}}
